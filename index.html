<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activate Your Product — 2-Hour CLO</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0d0d0d;--surface:#131313;--surface-2:#181818;
--border:#1e1e1e;--border-2:#2a2a2a;
--text:#e4e5ef;--text-muted:#9ea3ba;--text-dim:#4a4d60;
--accent:#79EA20;--accent-dim:rgba(121,234,32,.12);--accent-border:rgba(121,234,32,.35);
--red:#f87171;--red-dim:rgba(248,113,113,.1);
--radius:8px;--radius-lg:12px;
}
html{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

.container{max-width:480px;width:100%}

.logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;justify-content:center}
.logo-icon{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--bg)}
.logo-text{font-size:20px;font-weight:700;letter-spacing:-.3px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px}
.card h1{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-bottom:6px}
.card .subtitle{color:var(--text-muted);font-size:14px;margin-bottom:28px}

.product-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--accent-dim);border:1px solid var(--accent-border);border-radius:6px;font-size:13px;font-weight:600;color:var(--accent);margin-bottom:20px}

.field{margin-bottom:20px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text-muted)}
.field input{width:100%;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--radius);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--accent-border)}
.field input::placeholder{color:var(--text-dim)}
.field .hint{font-size:12px;color:var(--text-dim);margin-top:4px}
.field .hint a{color:var(--accent);text-decoration:none}

.btn{width:100%;padding:14px;background:var(--accent);color:var(--bg);border:none;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s;margin-top:8px}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.4;cursor:not-allowed}

.status{margin-top:20px;padding:14px 16px;border-radius:var(--radius);font-size:14px;display:none}
.status.success{display:block;background:var(--accent-dim);border:1px solid var(--accent-border);color:var(--accent)}
.status.error{display:block;background:var(--red-dim);border:1px solid rgba(248,113,113,.3);color:var(--red)}
.status.loading{display:block;background:var(--surface-2);border:1px solid var(--border-2);color:var(--text-muted)}

.steps{margin-top:32px;padding-top:24px;border-top:1px solid var(--border)}
.steps h3{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text-muted)}
.step{display:flex;align-items:start;gap:10px;margin-bottom:10px;font-size:13px;color:var(--text-dim)}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;color:var(--text-muted)}

.footer{text-align:center;margin-top:24px;font-size:12px;color:var(--text-dim)}
.footer a{color:var(--accent);text-decoration:none}

.error-page{text-align:center;padding:48px 24px}
.error-page h1{font-size:24px;margin-bottom:8px}
.error-page p{color:var(--text-muted);font-size:15px}

.install-step{margin-bottom:18px}
.install-step-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.install-step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.install-step-title{font-size:14px;font-weight:600;color:var(--text)}
.cmd-block{position:relative;background:#000;border:1px solid var(--border-2);border-radius:var(--radius);padding:12px 14px;padding-right:60px;font-family:'SF Mono','Monaco','Consolas',monospace;font-size:13px;color:var(--accent);overflow-x:auto;white-space:nowrap}
.copy-btn{position:absolute;top:8px;right:8px;background:var(--surface-2);border:1px solid var(--border-2);color:var(--text-muted);font-size:11px;font-weight:600;padding:4px 10px;border-radius:4px;cursor:pointer;transition:all .15s}
.copy-btn:hover{background:var(--accent-dim);color:var(--accent);border-color:var(--accent-border)}
.copy-btn.copied{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.license-display{background:var(--surface-2);border:1px dashed var(--border-2);border-radius:var(--radius);padding:10px 14px;font-family:'SF Mono','Monaco','Consolas',monospace;font-size:12px;color:var(--text-muted);word-break:break-all;margin-bottom:12px}
.course-cta{display:block;text-align:center;margin-top:24px;padding:14px;background:transparent;color:var(--accent);border:1px solid var(--accent-border);border-radius:var(--radius);font-size:14px;font-weight:600;text-decoration:none;transition:all .2s}
.course-cta:hover{background:var(--accent-dim)}
</style>
</head>
<body>

<div class="container" id="app"></div>

<script>

// ── CONFIG ──

const N8N_WEBHOOK_URL = 'https://twohourman.app.n8n.cloud/webhook/activate-product';

// ══════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════
const params = new URLSearchParams(window.location.search);
const productSlug = params.get('product');
const licenseKeyFromUrl = params.get('license_key');
const product = productSlug ? PRODUCTS[productSlug] : null;

const app = document.getElementById('app');

if (!product) {

  app.innerHTML = `
    <div class="error-page">
      <h1>Invalid Activation Link</h1>
      <p>This activation link is missing a product reference. Please use the link from your purchase confirmation email.</p>
      <div class="footer" style="margin-top:24px">
        Questions? Email <a href="mailto:rashid@thepeakperformer.io">rashid@thepeakperformer.io</a>
      </div>
    </div>`;
} else {
  document.title = `Activate ${product.name} — 2-Hour CLO`;

  if (product.distribution_type === 'mcp') {
    renderMcpForm();
  } else if (product.distribution_type === 'skillstack') {
    renderSkillStackForm();
  } else {
    renderCollaboratorForm();
  }
}

// ══════════════════════════════════════════════════════
// ACTIVATION HANDLER
// ══════════════════════════════════════════════════════
async function handleActivate(e) {
  e.preventDefault();

  const licenseKey = document.getElementById('licenseKey').value.trim();
  const githubUsername = document.getElementById('githubUsername').value.trim();
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  if (!licenseKey || !githubUsername) return;

  statusEl.className = 'status loading';
  statusEl.textContent = 'Validating your license key...';
  submitBtn.disabled = true;

  try {
    // Step 1: Activate the license key with LemonSqueezy
    const activateRes = await fetch('https://api.lemonsqueezy.com/v1/licenses/activate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        license_key: licenseKey,
        instance_name: githubUsername
      })
    });

    const data = await activateRes.json();

    if (!data.activated && !data.valid) {
      const errorMsg = data.error || 'Invalid license key or already activated.';
      throw new Error(errorMsg);
    }

    // Verify this key belongs to the correct product
    if (product.store_id && data.meta?.store_id !== product.store_id) {
      throw new Error('This license key is not valid for this product.');
    }
    if (product.product_id && data.meta?.product_id !== product.product_id) {
      throw new Error('This license key is for a different product.');
    }

    statusEl.className = 'status loading';
    statusEl.textContent = 'License valid! Sending GitHub invitation...';

    // Step 2: Trigger n8n webhook with product info
    const webhookRes = await fetch(N8N_WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        product: productSlug,
        repo: product.repo || productSlug,
        github_username: githubUsername,
        license_key: licenseKey,
        customer_email: data.meta?.customer_email || '',
        customer_name: data.meta?.customer_name || '',
        instance_id: data.instance?.id || '',
        activated_at: new Date().toISOString()
      })
    });

    if (!webhookRes.ok) {
      throw new Error('Failed to send invitation. Please email rashid@thepeakperformer.io with your GitHub username.');
    }

    statusEl.className = 'status success';
    statusEl.innerHTML = `<strong>You're in!</strong> Redirecting you to the course...`;
    submitBtn.textContent = 'Activated';
    submitBtn.disabled = true;

    // Redirect to the course page after brief delay
    const courseUrl = product.course_url || `welcome.html?product=${productSlug}`;
    setTimeout(() => {
      window.location.href = courseUrl;
    }, 1500);

  } catch (err) {
    statusEl.className = 'status error';
    statusEl.textContent = err.message;
    submitBtn.disabled = false;
  }
}

// ══════════════════════════════════════════════════════
// SKILLSTACK ACTIVATION HANDLER
// Validates license, then shows install commands inline
// ══════════════════════════════════════════════════════
async function handleSkillStackActivate(e) {
  e.preventDefault();

  const licenseKey = document.getElementById('licenseKey').value.trim();
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  if (!licenseKey) return;

  statusEl.className = 'status loading';
  statusEl.textContent = 'Validating your license key...';
  submitBtn.disabled = true;

  try {
    // Validate license against LemonSqueezy
    const validateRes = await fetch('https://api.lemonsqueezy.com/v1/licenses/validate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ license_key: licenseKey })
    });

    const data = await validateRes.json();

    if (!data.valid) {
      throw new Error(data.error || 'Invalid license key. Check your purchase confirmation email.');
    }

    // Verify the key belongs to this specific product
    if (product.store_id && data.meta?.store_id !== product.store_id) {
      throw new Error('This license key is not valid for this product.');
    }
    if (product.product_id && data.meta?.product_id !== product.product_id) {
      throw new Error('This license key is for a different product. Make sure you used the link from your ' + product.name + ' confirmation email.');
    }

    // License valid — swap UI to install commands
    renderInstallCommands(licenseKey);

  } catch (err) {
    statusEl.className = 'status error';
    statusEl.textContent = err.message;
    submitBtn.disabled = false;
  }
}

// INSTALL COMMANDS UI

          <div class="install-step-title">Add the AIEB thin-plugin marketplace</div>
        </div>
        <div class="cmd-block">
          <span id="mcpCmd1">${cmd1}</span>
          <button class="copy-btn" data-copy="mcpCmd1">Copy</button>
        </div>
      </div>

      <div class="install-step">
        <div class="install-step-header">
          <div class="install-step-num">2</div>
          <div class="install-step-title">Install the thin MCP shell</div>
        </div>
        <div class="cmd-block">
          <span id="mcpCmd2">${cmd2}</span>
          <button class="copy-btn" data-copy="mcpCmd2">Copy</button>
        </div>
      </div>

      <div class="install-step">
        <div class="install-step-header">
          <div class="install-step-num">3</div>
          <div class="install-step-title">Reload Claude Code</div>
        </div>
        <div class="cmd-block">
          <span id="mcpCmd3">${cmd3}</span>
          <button class="copy-btn" data-copy="mcpCmd3">Copy</button>
        </div>
      </div>

      <div class="install-step">
        <div class="install-step-header">
          <div class="install-step-num">4</div>
          <div class="install-step-title">Ask Claude to add your MCP license config</div>
        </div>
        <div class="license-display" id="setupPrompt">${setupPrompt}</div>
        <button class="copy-btn" data-copy="setupPrompt" style="position:static;display:inline-block;margin-top:-4px">Copy setup prompt</button>
      </div>

      ${product.course_url ? '<a class="course-cta" href="' + product.course_url + '">Continue to the onboarding course</a>' : ''}
    </div>

    <div class="footer">
      Questions? Email <a href="mailto:rashid@thepeakperformer.io">rashid@thepeakperformer.io</a>
    </div>`;

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetId = btn.dataset.copy;
      const text = document.getElementById(targetId).textContent.trim();
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.textContent;
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = originalText;
          btn.classList.remove('copied');

    });
  });
}

        </div>
        <div class="cmd-block">
          <span id="cmd2">${cmd2}</span>
          <button class="copy-btn" data-copy="cmd2">Copy</button>
        </div>
      </div>

      <div class="install-step">
        <div class="install-step-header">
          <div class="install-step-num">3</div>
          <div class="install-step-title">Restart Claude Code</div>
        </div>
        <div class="cmd-block">
          <span id="cmd3">${cmd3}</span>
          <button class="copy-btn" data-copy="cmd3">Copy</button>
        </div>
      </div>

      <div class="install-step">
        <div class="install-step-header">
          <div class="install-step-num">4</div>
          <div class="install-step-title">Activate your license (paste the key below when prompted)</div>
        </div>
        <div class="cmd-block">
          <span id="cmd4">${cmd4}</span>
          <button class="copy-btn" data-copy="cmd4">Copy</button>
        </div>
        <div class="license-display" id="license-display">${licenseKey}</div>
        <button class="copy-btn" data-copy="license-display" style="position:static;display:inline-block;margin-top:-4px">Copy license key</button>
      </div>

      ${product.course_url ? '<a class="course-cta" href="' + product.course_url + '">Continue to the onboarding course →</a>' : ''}
    </div>

    <div class="footer">
      Questions? Email <a href="mailto:rashid@thepeakperformer.io">rashid@thepeakperformer.io</a>
    </div>`;

  // Wire up copy buttons
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetId = btn.dataset.copy;
      const text = document.getElementById(targetId).textContent.trim();
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.textContent;
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = originalText;
          btn.classList.remove('copied');
        }, 1500);
      });
    });
  });
}
</script>

</body>
</html>
